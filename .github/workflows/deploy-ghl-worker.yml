# Deploys the Terrific 30 signup relay. Skips cleanly until the Cloudflare
# secrets exist, so this can land before the Cloudflare account is ready.
name: Deploy GHL opt-in worker

on:
  workflow_dispatch:
  push:
    # workflow_dispatch is hidden until this file is on main, so pushes to the
    # open pull-request branch deploy the Worker before merge.
    branches:
      - main
      - cursor/ghl-optin-worker-89d9
    paths:
      - "workers/ghl-optin/**"
      - ".github/workflows/deploy-ghl-worker.yml"

permissions:
  contents: read

concurrency:
  group: ghl-optin-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Worker
        run: node --experimental-strip-types --test workers/ghl-optin/src/index.test.ts

      - name: Check Cloudflare secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set."
            echo "Skipping Worker deploy. Add both secrets, then re-run this workflow."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$GHL_PRIVATE_INTEGRATION_TOKEN" ]; then
            echo "Cloudflare secrets are set, but GHL_PRIVATE_INTEGRATION_TOKEN is missing."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker and store the GoHighLevel token
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ghl-optin
          packageManager: npm
          # Secret upload needs the Worker to exist, so deploy once before it.
          preCommands: wrangler deploy
          secrets: |
            GHL_PRIVATE_INTEGRATION_TOKEN
          command: deploy
        env:
          GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN }}
