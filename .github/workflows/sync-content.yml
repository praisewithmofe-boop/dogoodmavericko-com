# Adds new YouTube uploads and podcast episodes, then asks the existing
# deploy workflow to publish them. A push made with the default GITHUB_TOKEN
# does not start other workflows, so this run dispatches Deploy afterwards.
name: Sync new videos and podcast episodes

on:
  schedule:
    # Every 4 hours. GitHub may start a scheduled run a few minutes late.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be added and do not commit
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Only commit from main
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: |
          echo "This workflow only commits when it runs on main. Run it with dry_run to preview."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content from the public feeds
        run: node scripts/sync-content.mjs ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: See if anything new was written
        id: changes
        if: inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new. No commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          fi

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: SEO audit
        if: steps.changes.outputs.changed == 'true'
        run: npm run seo:audit

      - name: Commit new content
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/videos content/podcast public/images
          changed="$(git diff --cached --name-only --diff-filter=MD)"
          if [ -n "$changed" ]; then
            echo "Refusing to modify or delete existing files:"
            echo "$changed"
            exit 1
          fi
          unexpected="$(git diff --cached --name-only | grep -vE '^(content/videos/.+\.mdx|content/podcast/.+\.mdx|public/images/.+)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Refusing to commit unexpected paths:"
            echo "$unexpected"
            exit 1
          fi
          git commit -m "Add new YouTube videos and podcast episodes"
          git push origin HEAD:main

      - name: Publish with the existing deploy workflow
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
