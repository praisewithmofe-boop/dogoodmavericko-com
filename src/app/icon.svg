<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0b0b0a" />
  <!-- D: stem + bowl, counter cut with evenodd -->
  <path
    d="M3,6 L9,6 A8,10 0 0 1 9,26 L3,26 Z M7,9 A5,7 0 0 1 7,23 Z"
    fill="#c69a3c"
    fill-rule="evenodd"
  />
  <!-- M: two stems + a center wedge tapering to a raised notch -->
  <rect x="18" y="6" width="3.5" height="20" fill="#c69a3c" />
  <rect x="27.5" y="6" width="3.5" height="20" fill="#c69a3c" />
  <polygon points="21.5,6 27.5,6 24.5,19" fill="#c69a3c" />
</svg>
